[build]
  command = "npm test"
  publish = "web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200
  force = true

[[redirects]]
  from = "/api/alerts"
  to = "/.netlify/functions/alerts"
  status = 200
  force = true
